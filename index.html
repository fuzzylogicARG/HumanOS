<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Human Operating System — Pricing</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background:#07070a; }
    .checkout-loader {
      position:fixed; inset:0; z-index:99999;
      background:rgba(0,0,0,.7);
      display:flex; align-items:center; justify-content:center;
    }
    .checkout-box {
      background:#111118;
      border:1px solid #333;
      padding:30px;
      border-radius:20px;
      text-align:center;
      color:white;
    }
  </style>
</head>

<body class="text-white">

<!-- NAV -->
<nav class="p-4 flex justify-between max-w-6xl mx-auto">
  <div class="font-bold text-xl">HOS</div>
  <a href="#plans" class="bg-yellow-400 text-black px-4 py-2 rounded-xl font-bold">
    Start
  </a>
</nav>

<!-- HERO -->
<section class="text-center py-20 max-w-4xl mx-auto">
  <h1 class="text-5xl font-bold">Upgrade Your System</h1>
  <p class="mt-4 text-gray-400">
    30-day system to rebuild discipline and focus
  </p>
</section>

<!-- PLANS -->
<section id="plans" class="max-w-6xl mx-auto grid md:grid-cols-3 gap-6 px-4">

  <!-- ENTRY -->
  <div class="bg-[#111118] p-6 rounded-xl">
    <h3 class="text-xl font-bold">Entry</h3>
    <div class="text-4xl mt-4">$19.99</div>

    <button onclick="checkout('stripe_entry')" class="mt-6 w-full bg-green-400 text-black py-3 rounded-xl font-bold">
      Pay with Card
    </button>

    <button onclick="checkout('paypal_entry')" class="mt-3 w-full bg-blue-400 text-black py-3 rounded-xl font-bold">
      PayPal
    </button>

    <button onclick="checkout('square_entry')" class="mt-3 w-full bg-gray-300 text-black py-3 rounded-xl font-bold">
      Square
    </button>
  </div>

  <!-- BASIC -->
  <div class="bg-[#111118] p-6 rounded-xl border border-yellow-400">
    <h3 class="text-xl font-bold">Basic</h3>
    <div class="text-4xl mt-4">$30</div>

    <button onclick="checkout('stripe_basic')" class="mt-6 w-full bg-green-400 text-black py-3 rounded-xl font-bold">
      Pay with Card
    </button>

    <button onclick="checkout('paypal_basic')" class="mt-3 w-full bg-blue-400 text-black py-3 rounded-xl font-bold">
      PayPal
    </button>

    <button onclick="checkout('square_basic')" class="mt-3 w-full bg-gray-300 text-black py-3 rounded-xl font-bold">
      Square
    </button>
  </div>

  <!-- PREMIUM -->
  <div class="bg-[#111118] p-6 rounded-xl">
    <h3 class="text-xl font-bold">Premium</h3>
    <div class="text-4xl mt-4">$60</div>

    <button onclick="checkout('stripe_premium')" class="mt-6 w-full bg-green-400 text-black py-3 rounded-xl font-bold">
      Pay with Card
    </button>

    <button onclick="checkout('paypal_premium')" class="mt-3 w-full bg-blue-400 text-black py-3 rounded-xl font-bold">
      PayPal
    </button>

    <button onclick="checkout('square_premium')" class="mt-3 w-full bg-gray-300 text-black py-3 rounded-xl font-bold">
      Square
    </button>
  </div>

</section>

<script>
const links = {
  stripe_entry: "https://buy.stripe.com/28E14pcn57468wDh0mdnW01",
  stripe_basic: "https://buy.stripe.com/9B68wR9aT6023cj25sdnW02",
  stripe_premium: "https://buy.stripe.com/3cI7sNgDl9cebIP25sdnW00",

  paypal_entry: "https://www.paypal.com/ncp/payment/5CENKK5SG8XBG",
  paypal_basic: "https://www.paypal.com/ncp/payment/FFACKFK88LBDC",
  paypal_premium: "https://www.paypal.com/ncp/payment/UWDJ48Z9CXEES",

  square_entry: "https://square.link/u/H6LuweD4",
  square_basic: "https://square.link/u/8uJKHCkM",
  square_premium: "https://square.link/u/S4iY2ZmV"
};

function checkout(type){
  const link = links[type];
  if(!link) return;

  const loader = document.createElement("div");
  loader.className = "checkout-loader";
  loader.innerHTML = "<div class='checkout-box'>Redirecting...</div>";
  document.body.appendChild(loader);

  setTimeout(()=> window.open(link,"_blank"),500);
}
</script>

</body>
</html>
